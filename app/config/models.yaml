# Which model does which job. Change a model here; no code changes needed.
#
# Roles
#   ask_router   classifies the user's question and picks tool arguments (short, structured JSON)
#   ask_answer   writes the final answer in Croatian or English from tool results
#   extraction   pulls problems/approaches/target groups/outputs out of project summaries
#   translation  Croatian labels for concepts and topics
#   embeddings   semantic search and concept clustering (must handle Croatian)
#
# Providers
#   ollama   a model served by a local Ollama (`ollama pull <model>` first)
#   openai   any OpenAI-compatible server: vLLM, llama.cpp server, LM Studio, or a hosted API (set base_url)
#
# Select a profile with  active_profile  below, or per run:  ATLAS_PROFILE=gemma8b
# Other overrides: ATLAS_OLLAMA_URL (default http://127.0.0.1:11434), ATLAS_OPENAI_API_KEY.

# auto = "qwen3_4b_2507" when a GPU is present (NVIDIA or Apple silicon), otherwise "cpu". Force CPU with ATLAS_FORCE_CPU=1.
active_profile: auto

# Limits that matter on CPU-only machines: too many parallel LLM calls starve the threads and can freeze the host.
runtime:
  max_concurrency: 2        # parallel LLM requests from the pipeline and API (use 1-2 on CPU, 4-8 on a GPU)

profiles:

  # Small models for the public Ask page; Gemma 8B stays on the offline extraction job.
  light:
    ask_router:   {provider: ollama, model: "qwen2.5:3b-instruct", temperature: 0.0, num_ctx: 4096}
    ask_answer:   {provider: ollama, model: "qwen2.5:3b-instruct", temperature: 0.2, num_ctx: 8192}
    extraction:   {provider: ollama, model: "gemma4:latest",       temperature: 0.0, num_ctx: 8192}
    translation:  {provider: ollama, model: "gemma4:latest",       temperature: 0.0, num_ctx: 4096}
    embeddings:   {provider: ollama, model: "bge-m3"}

  # CPU-only host (no GPU): smallest model that can still produce valid JSON; the default tag is already Q4_K_M.
  # bge-m3 (not nomic-embed-text, which is English-focused) because queries are Croatian.
  cpu:
    ask_router:   {provider: ollama, model: "qwen2.5:3b-instruct", temperature: 0.0, num_ctx: 4096}
    ask_answer:   {provider: ollama, model: "qwen2.5:3b-instruct", temperature: 0.2, num_ctx: 4096}
    extraction:   {provider: ollama, model: "qwen2.5:3b-instruct", temperature: 0.0, num_ctx: 4096}
    translation:  {provider: ollama, model: "qwen2.5:3b-instruct", temperature: 0.0, num_ctx: 2048}
    embeddings:   {provider: ollama, model: "bge-m3"}

  # Everything on the Gemma model that is already installed.
  gemma8b:
    ask_router:   {provider: ollama, model: "gemma4:latest", temperature: 0.0, num_ctx: 4096}
    ask_answer:   {provider: ollama, model: "gemma4:latest", temperature: 0.2, num_ctx: 8192}
    extraction:   {provider: ollama, model: "gemma4:latest", temperature: 0.0, num_ctx: 8192}
    translation:  {provider: ollama, model: "gemma4:latest", temperature: 0.0, num_ctx: 4096}
    embeddings:   {provider: ollama, model: "bge-m3"}

  # Example: Ask on a hosted or self-hosted OpenAI-compatible endpoint (fill in before use).
  hosted:
    ask_router:   {provider: openai, model: "CHANGE-ME", base_url: "https://CHANGE-ME/v1", temperature: 0.0}
    ask_answer:   {provider: openai, model: "CHANGE-ME", base_url: "https://CHANGE-ME/v1", temperature: 0.2}
    extraction:   {provider: ollama, model: "gemma4:latest", temperature: 0.0, num_ctx: 8192}
    translation:  {provider: ollama, model: "gemma4:latest", temperature: 0.0, num_ctx: 4096}
    embeddings:   {provider: ollama, model: "bge-m3"}

  # Candidates from the model search (2026-10-29), to be tested with eval/run_ask.py --mode llm. think: false = no reasoning phase.
  qwen35:
    ask_router:   {provider: ollama, model: "qwen3.5:4b", temperature: 0.0, num_ctx: 4096, think: false}
    ask_answer:   {provider: ollama, model: "qwen3.5:9b", temperature: 0.2, num_ctx: 8192, think: false}
    extraction:   {provider: ollama, model: "qwen3.5:9b", temperature: 0.0, num_ctx: 8192, think: false}
    translation:  {provider: ollama, model: "qwen3.5:9b", temperature: 0.0, num_ctx: 4096, think: false}
    embeddings:   {provider: ollama, model: "bge-m3"}

  # Large GPU profile (needs `ollama pull gemma4:31b`, 20 GB): phrasing and extraction by the 31B model, routing by the small one.

  # Higher-precision builds for the GPU (A100 40 GB): 8-bit, full precision, and Gemma 31B at 8-bit (34 GB, fits alone).
  qwen35_q8:
    ask_router:   {provider: ollama, model: "qwen3.5:4b", temperature: 0.0, num_ctx: 4096, think: false}
    ask_answer:   {provider: ollama, model: "qwen3.5:9b-q8_0", temperature: 0.2, num_ctx: 8192, think: false}
    extraction:   {provider: ollama, model: "qwen3.5:9b-q8_0", temperature: 0.0, num_ctx: 8192, think: false}
    translation:  {provider: ollama, model: "qwen3.5:9b-q8_0", temperature: 0.0, num_ctx: 4096, think: false}
    embeddings:   {provider: ollama, model: "bge-m3"}

  

  
  gemma31b_q8:
    ask_router:   {provider: ollama, model: "qwen3.5:4b", temperature: 0.0, num_ctx: 4096, think: false}
    ask_answer:   {provider: ollama, model: "gemma4:31b-it-q8_0", temperature: 0.2, num_ctx: 8192, think: false}
    extraction:   {provider: ollama, model: "gemma4:31b-it-q8_0", temperature: 0.0, num_ctx: 8192, think: false}
    translation:  {provider: ollama, model: "gemma4:31b-it-q8_0", temperature: 0.0, num_ctx: 4096, think: false}
    embeddings:   {provider: ollama, model: "bge-m3"}

  # OpenEuroLLM-Croatian (profile cand_oeuro) was removed 2026-11-03 with the model: not part of the blind rating, and the template answers are the default.

  # Removed 2026-10-30 after testing (models deleted from Ollama; results in LOG.md): gemma_e4b, gemma31b (Q4), qwen35_bf16, cand_mistral24, cand_qwen3_14b, cand_gemma3tools.

  # DeepSeek R1 distills 8B/14B/32B were tested 2026-10-31 and deleted (see LOG.md); their profiles were removed.

  # Qwen 2.5 7B Instruct (Apache-2.0, unlike the 3B build) for routing and phrasing; tested against light and qwen35 on 2026-11-05.
  qwen25_7b:
    ask_router:   {provider: ollama, model: "qwen2.5:7b-instruct", temperature: 0.0, num_ctx: 4096}
    ask_answer:   {provider: ollama, model: "qwen2.5:7b-instruct", temperature: 0.2, num_ctx: 8192}
    extraction:   {provider: ollama, model: "gemma4:latest",       temperature: 0.0, num_ctx: 8192}
    translation:  {provider: ollama, model: "gemma4:latest",       temperature: 0.0, num_ctx: 4096}
    embeddings:   {provider: ollama, model: "bge-m3"}

  # Qwen3 4B Instruct 2507 (Q4_K_M) for routing and phrasing; tested against light, qwen35 and qwen25_7b on 2026-11-05.
  qwen3_4b_2507:
    ask_router:   {provider: ollama, model: "qwen3:4b-instruct-2507-q4_K_M", temperature: 0.0, num_ctx: 4096}
    ask_answer:   {provider: ollama, model: "qwen3:4b-instruct-2507-q4_K_M", temperature: 0.2, num_ctx: 4096}
    extraction:   {provider: ollama, model: "gemma4:latest",       temperature: 0.0, num_ctx: 8192}
    translation:  {provider: ollama, model: "gemma4:latest",       temperature: 0.0, num_ctx: 4096}
    embeddings:   {provider: ollama, model: "bge-m3"}

  # CPU-only host that can run a 9B model (16+ cores, 16 GB RAM or more): tested 2026-11-01 on a 16-core machine with no GPU.
  cpu_qwen35:
    ask_router:   {provider: ollama, model: "qwen3.5:4b", temperature: 0.0, num_ctx: 4096, think: false}
    ask_answer:   {provider: ollama, model: "qwen3.5:9b", temperature: 0.2, num_ctx: 4096, think: false}
    extraction:   {provider: ollama, model: "qwen3.5:9b", temperature: 0.0, num_ctx: 8192, think: false}
    translation:  {provider: ollama, model: "qwen3.5:9b", temperature: 0.0, num_ctx: 4096, think: false}
    embeddings:   {provider: ollama, model: "bge-m3"}
