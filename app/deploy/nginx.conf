# Static hosting of site/dist behind nginx (used by deploy/Dockerfile).
# The real visitor address: Cloudflare puts it in CF-Connecting-IP; without a tunnel it is the direct peer.
map $http_cf_connecting_ip $ask_client_ip { default $http_cf_connecting_ip; "" $remote_addr; }

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Optional password for the whole site. ASK_AUTH is `off` (default) or a realm in quotes, e.g. "Erasmus+ Kompas demo"; the users
  # are in the file mounted at /etc/nginx/htpasswd (deploy/make_password.sh creates it).
  auth_basic ${ASK_AUTH};
  auth_basic_user_file /etc/nginx/htpasswd;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # hashed build assets can be cached for a year; pages and data must be revalidated
  # nginx does not inherit add_header into a location that sets its own, so the security headers are included in each one
  location /_astro/ { include /etc/nginx/conf.d/security_headers.inc; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /search.json { include /etc/nginx/conf.d/security_headers.inc; add_header Cache-Control "no-cache"; }
  # The Ask page posts to /api/ask. ASK_API_URL (an environment variable of the container, default http://127.0.0.1:8000) is where
  # `uvicorn atlas.api:app` runs; with nothing listening there the page shows its "something went wrong" message.
  # the contact form sends up to 1500 characters (Croatian letters take two bytes each), more than a question does
  location = /api/contact {
    include /etc/nginx/conf.d/security_headers.inc;
    proxy_pass ${ASK_API_URL}/contact;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $ask_client_ip;
    proxy_read_timeout 30s;
    client_max_body_size 8k;
  }
  location /api/ {
    include /etc/nginx/conf.d/security_headers.inc;
    proxy_pass ${ASK_API_URL}/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $ask_client_ip;
    proxy_read_timeout 90s;
    client_max_body_size 4k;
  }
  location / { include /etc/nginx/conf.d/security_headers.inc; add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
  error_page 404 /404.html;
}
